# ==============================================================================
# LiveKit SFU Production Configuration (livekit.prod.yaml)
# ==============================================================================

port: 7880
bind_addresses:
  - ""

# RTC Configuration
rtc:
  # WebRTC UDP traffic ports (Must be opened in host firewall)
  udp_port: 7882
  tcp_port: 7881
  port_range_start: 50000
  port_range_end: 60000

  # Replace with public IP or domain of your production media server node
  # use_external_ip: true
  # external_ip: "203.0.113.10"

  # TURN / STUN server configuration for restrictive NATs
  stun_servers:
    - "stun:stun.l.google.com:19302"
    - "stun:stun1.l.google.com:19302"

# API Authentication Keys
# Matches LIVEKIT_API_KEY and LIVEKIT_API_SECRET in backend/.env
keys:
  prod_livekit_key: "replace_with_a_secure_random_64_character_production_secret"

# Redis Cluster Signaling (Required for multi-node LiveKit clusters and Egress)
redis:
  address: "redis:6379"
  db: 0

# LiveKit Lifecycle Webhooks
# Dispatches recording and participant events directly to MeetSpace Express backend
webhook:
  api_key: "prod_livekit_key"
  urls:
    - "http://backend:5000/api/livekit/webhooks"

# Logging & Telemetry
logging:
  json: true
  level: info
