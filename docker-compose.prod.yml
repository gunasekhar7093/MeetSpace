services:
  # 1. Reverse Proxy (Nginx)
  proxy:
    image: nginx:alpine
    container_name: meetspace-proxy
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - frontend
      - backend
      - livekit
    networks:
      - meetspace-net

  # 2. Frontend Web Client (React + Vite)
  frontend:
    build:
      context: ./MeetSpace
      dockerfile: Dockerfile
    container_name: meetspace-frontend
    restart: always
    expose:
      - "80"
    networks:
      - meetspace-net

  # 3. Backend REST API & Socket.IO (Express)
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: meetspace-backend
    restart: always
    expose:
      - "5000"
    environment:
      - NODE_ENV=production
      - PORT=5000
      - MONGODB_URI=mongodb://mongo:27017/meetspace_prod
      - FRONTEND_URL=http://localhost
      - JWT_ACCESS_SECRET=${JWT_ACCESS_SECRET}
      - JWT_REFRESH_SECRET=${JWT_REFRESH_SECRET}
      - LIVEKIT_URL=http://livekit:7880
      - LIVEKIT_API_KEY=${LIVEKIT_API_KEY}
      - LIVEKIT_API_SECRET=${LIVEKIT_API_SECRET}
      - MOCK_EGRESS=false
      - EGRESS_STORAGE_TYPE=${EGRESS_STORAGE_TYPE:-local}
      - RECORDINGS_DIR=/app/recordings
      - EGRESS_S3_KEY=${EGRESS_S3_KEY}
      - EGRESS_S3_SECRET=${EGRESS_S3_SECRET}
      - EGRESS_S3_BUCKET=${EGRESS_S3_BUCKET}
      - EGRESS_S3_REGION=${EGRESS_S3_REGION}
    volumes:
      - recordings_data:/app/recordings
    depends_on:
      mongo:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - meetspace-net

  # 4. LiveKit SFU Media Server
  livekit:
    image: livekit/livekit-server:v1.8.3
    container_name: meetspace-livekit
    restart: always
    command: --config /etc/livekit.yaml
    volumes:
      - ./livekit/livekit.prod.yaml:/etc/livekit.yaml:ro
    ports:
      - "7880:7880"
      - "7881:7881"
      - "7882:7882/udp"
      - "50000-60000:50000-60000/udp"
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - meetspace-net

  # 5. LiveKit Egress Worker (Headless Chromium, PulseAudio, GStreamer)
  egress:
    image: livekit/egress:v1.8.3
    container_name: meetspace-egress
    restart: always
    environment:
      - EGRESS_CONFIG_FILE=/etc/egress.yaml
    volumes:
      - recordings_data:/home/egress/recordings
    depends_on:
      - livekit
      - redis
    networks:
      - meetspace-net

  # 6. Redis Cluster Signaling
  redis:
    image: redis:7-alpine
    container_name: meetspace-redis
    restart: always
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    networks:
      - meetspace-net

  # 7. Production Database (MongoDB Replica Set)
  mongo:
    image: mongo:7.0
    container_name: meetspace-mongo
    restart: always
    command: ["mongod", "--bind_ip_all"]
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - meetspace-net

networks:
  meetspace-net:
    driver: bridge

volumes:
  mongo_data:
  redis_data:
  recordings_data:
